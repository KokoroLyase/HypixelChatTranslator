distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.5.1-bin.zip
# 完整性校验（v3.0.0 洁净度审计补）：wrapper 会在使用前核对下载包的 sha256，
# 不匹配就直接失败。这是目前最常见的供应链攻击面 —— 只有 distributionUrl 时，
# 中间人换掉那个 zip 就能在我们的构建里跑任意代码。
# 值取自 https://services.gradle.org/distributions/gradle-9.5.1-bin.zip.sha256，
# 并用本机重新下载的官方包实测核对过，两者一致。
distributionSha256Sum=bafc141b619ad6350fd975fc903156dd5c151998cc8b058e8c1044ab5f7b031f
networkTimeout=10000
retries=0
retryBackOffMs=500
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
