buildscript {
    repositories {
        maven { name = "forge"; url = "https://maven.minecraftforge.net/" }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

// ------------------------------------------------------------------
// 双版本里的 1.8.9 + Forge 线。
//
// 它与仓库根目录的 Fabric 构建**编译同一份共享源码**（../src/shared/java），
// 区别只在装配层：src/main/java 下是本线专属的入口、事件注册、聊天渲染、命令，
// 外加一个 ASM 核心插件（1.8.9 没有 ClientChatEvent，拦发送只能靠字节码注入，见 asm/）。
//
// 这个构建必须用 JDK 8 + Gradle 2.14.1：Gradle 2.x 跑不了 Java 9+，
// 而 ForgeGradle 2.1 跑不了 Gradle 3+。
// ------------------------------------------------------------------

// 模组版本号只有一个来源：仓库根目录的 gradle.properties。
// 两条线共用同一个版本号是硬要求（v2.3.0 的 Fabric 版与 1.8.9 版同号）。
def rootProps = new Properties()
file('../gradle.properties').withInputStream { rootProps.load(it) }

version = rootProps.getProperty('mod_version')
group = rootProps.getProperty('maven_group')
archivesBaseName = rootProps.getProperty('archives_base_name')

def modVersion = project.version
def mcVersion = project.minecraft_version
def loaderTag = 'forge'

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

// ------------------------------------------------------------------
// 源码一律按 UTF-8 读（v3.0.5 修）。
//
// Fabric 线的 build.gradle 一直显式写着 options.encoding = "UTF-8"，这条线**漏了** ——
// 在 macOS / Linux / CI（默认字符集都是 UTF-8）上完全看不出问题，
// 但在**中文 Windows（默认 GBK）**上 javac 会按 GBK 去读 UTF-8 源码：
// LangUtils.stripWrappingQuotes 里用的是全角引号 '“' / '”'，这两个字符被解成乱码后，
// 编译直接报「未结束的字符文字 / 非法字符」，一次 100 个错误，而且报错那一行看着完全正常。
//
// 显式钉住编码之后，构建结果不再取决于运行环境的默认字符集 ——
// 也就是不再需要 JAVA_TOOL_OPTIONS=-Dfile.encoding=UTF-8 这类外部绕过。
// 注意 JavaCompile 覆盖的是**全部** Java 编译任务（含 verifyCore / verifyCoremod 那两个自检源集，
// 它们同样含中文），所以这一条必须写在 tasks.withType 上，而不是只配某一个任务。
// ------------------------------------------------------------------
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

sourceSets {
    main {
        java.srcDirs = ['src/main/java', '../src/shared/java']
    }
}

// 版本号要出现在两个地方：mcmod.info（processResources 展开）和 @Mod 注解。
// 注解要求编译期常量，所以这里生成一个小小的常量类，保证版本号仍然只有一个来源
// （仓库根目录 gradle.properties 的 mod_version）。
task generateVersionSource {
    def outDir = file("$buildDir/generated/source/hxversion")
    outputs.dir outDir
    doLast {
        def pkgDir = new File(outDir, "com/isomeria/hxtranslate/forge")
        pkgDir.mkdirs()
        new File(pkgDir, "HxVersion.java").withWriter("UTF-8") { w ->
            w.println "package com.isomeria.hxtranslate.forge;"
            w.println ""
            w.println "/**"
            w.println " * 由 build.gradle 生成，值来自仓库根目录 gradle.properties 的 mod_version。"
            w.println " * 不要手改：两条线必须永远同号。"
            w.println " */"
            w.println "public final class HxVersion {"
            w.println ""
            w.println "    public static final String VERSION = \"${modVersion}\";"
            w.println ""
            w.println "    private HxVersion() {"
            w.println "    }"
            w.println "}"
        }
    }
}

sourceSets.main.java.srcDir "$buildDir/generated/source/hxversion"
compileJava.dependsOn generateVersionSource

// ------------------------------------------------------------------
// 离线自检：与 Fabric 线跑**同一份** tools/VerifyCore.java。
// 两条线编译同一份共享源码，所以这一套断言同时保护两个版本 ——
// 在 1.8.9 这条线上它额外承担一个职责：用 JDK 8 编译共享层，
// 任何 Java 9+ 的语法或 API 都会在这里直接编译失败（含糊的运行时错误提前到编译期）。
//
// 类路径刻意只放行 gson：Minecraft / Forge 一律不进自检，
// 这样「共享层误引用游戏 API」会在自检里立刻炸出来（与 Fabric 线同一个门禁）。
// ------------------------------------------------------------------
sourceSets {
    verify {
        java {
            srcDir '../tools'
            // 只编译 VerifyCore：tools/ 下还有 VerifyCoremod.java（要 ASM），
            // 不加这个过滤会把两个都拉进来，类路径就对不上了。
            include 'VerifyCore.java'
        }
        // 自检的类路径**只放行 gson**：Minecraft / Forge 一律不进，
        // 「共享层误引用游戏 API」才会在自检里立刻炸出来。
        // 版本钉在 1.8.9 自带的 2.2.4，这样自检跑的就是这条线真实面对的 API 面。
        compileClasspath = sourceSets.main.output + configurations.verifyCompile
        runtimeClasspath = output + compileClasspath
    }
    // 核心插件验证的源集必须在 dependencies 之前声明：
    // verifyCoremodCompile 这个配置是随源集一起创建的，声明晚了就用不了。
    verifyCoremod {
        java {
            srcDir '../tools'
            include 'VerifyCoremod.java'
        }
        compileClasspath = sourceSets.main.output + configurations.verifyCoremodCompile
        // 运行时**额外**要一份 Minecraft 运行库，理由见下面 verifyCoremod 任务的注释：
        // 没有它，EntityPlayerSP 在「加载」阶段就抛 NoClassDefFoundError（缺 guava 等），
        // 真 JVM 校验器根本没轮到执行 —— 那一项会变成永远绿灯的假门禁。
        //
        // 用 forgeGradleMcDeps（全量：guava / authlib / netty / log4j / commons-lang3 / lwjgl …）
        // 而不是 forgeGradleMcDepsClient —— 后者只含 LWJGL 那几个**客户端**库，
        // 实测缺 guava，类照样加载不起来。
        //
        // 只影响任务运行时类路径，不进 compileClasspath、也绝不会打进 jar
        // （jar 的内容由 sourceSets.main 决定，这里动的是 verifyCoremod 源集）。
        runtimeClasspath = output + compileClasspath + configurations.forgeGradleMcDeps
    }
}

task verifyCore(type: JavaExec, dependsOn: 'verifyClasses') {
    group = 'verification'
    description = '运行离线自检（与 Fabric 线同一份断言）'
    // 自检要读仓库根目录的文件（README / gradle.properties / src/**），必须在根目录跑
    workingDir = project.file('..')
    classpath = sourceSets.verify.runtimeClasspath
    main = 'VerifyCore'
}

check.dependsOn verifyCore

minecraft {
    version = project.forge_version
    runDir = 'run'
    mappings = project.mappings_version
}

repositories {
    mavenCentral()
}

dependencies {
    // ASM 在运行时由 FML 的启动类加载器提供（1.8.9 自带 asm-all 5.0.3），
    // 所以只要编译期可见，**绝不能打进 jar**（打包会导致版本冲突）。
    compileOnly 'org.ow2.asm:asm-all:5.0.3'

    // 离线自检用：1.8.9 自带的 gson 版本（刻意不用更新的，免得掩盖兼容问题）
    verifyCompile 'com.google.code.gson:gson:2.2.4'

    // 核心插件验证用：编译期只放 ASM 与 launchwrapper（IClassTransformer 的宿主）。
    // Minecraft / Forge 不进 **compileClasspath** —— VerifyCoremod 只碰 ASM 与字节数组。
    //
    // 但**运行时**要给一份 Minecraft 运行库（见上面 verifyCoremod 源的 runtimeClasspath）：
    // 2026-09-17 审计发现，缺了它时 `Class.forName(EntityPlayerSP)` 会在加载阶段就抛
    // NoClassDefFoundError（第一个缺的是 guava 的 Predicate），真校验器根本没执行，
    // 而原来的 catch-all 会把这种情况记成「校验通过」—— 那道门禁其实一直是假的。
    // 它只进 verifyCoremod 的运行时类路径，不进产物 jar。
    verifyCoremodCompile 'org.ow2.asm:asm-all:5.0.3'
    verifyCoremodCompile 'net.minecraft:launchwrapper:1.12'
}

// ------------------------------------------------------------------
// 核心插件验证任务（源集在上面的 sourceSets 里）
//
// ASM 注入是这条线上唯一「不跑游戏就没法确认」的部分：这里用**真实的** deobf
// EntityPlayerSP 跑一遍转换器，再交给**真 JVM 的校验器**（-Xverify:all）验字节码，
// 并做三项反向验证（非目标类原样返回 / SRG 名命中 / 混淆名命中）。
//
// 挂在 check 上，所以 `gradle build` 会顺带跑完，失败即构建失败。
// ------------------------------------------------------------------
task verifyCoremod(type: JavaExec, dependsOn: 'verifyCoremodClasses') {
    group = 'verification'
    description = '离线验证 ASM 注入：真实 EntityPlayerSP + 真 JVM 字节码校验'
    classpath = sourceSets.verifyCoremod.runtimeClasspath
    main = 'VerifyCoremod'
    // 强制全量字节码校验：注入出问题时这里会直接抛 VerifyError
    jvmArgs = ['-Xverify:all']
    doFirst {
        def deobf = configurations.forgeGradleMc.files.find { it.name.startsWith('forgeBin-') }
        if (deobf == null) {
            // 找不到目标 jar 必须**响亮地失败**：静默跳过等于这道门禁不存在
            throw new GradleException('找不到 deobf 的 forgeBin jar，核心插件验证无法进行')
        }
        args = [deobf.absolutePath, "$buildDir/coremod-verify"]
    }
}

check.dependsOn verifyCoremod

processResources {
    // 资源文件同样按 UTF-8 处理（与上面 JavaCompile 那条同一个根因，v3.0.5 一起修）。
    //
    // mcmod.info 里有中文描述，而它要过一遍 `expand` 做 ${version} / ${mcversion} 替换 ——
    // Gradle 2.14 的 expand 用的是**运行环境的默认字符集**，中文 Windows（GBK）上会把
    // 「）。纯客户端，服务器无需安装。」这类字符写成 U+FFFD 替换字符，产出坏掉的 mcmod.info。
    // 这个坑更隐蔽：构建是**绿的**，jar 也能装，只有游戏内模组列表里的中文变成乱码。
    // CI（Ubuntu，默认 UTF-8）与 macOS / Linux 都看不出来，所以从没在 CI 上暴露过。
    //
    // 注：assets/*/lang/*.lang 不走 expand（它们是原样拷贝），不受影响。
    filteringCharset = 'UTF-8'

    inputs.property "version", modVersion
    inputs.property "mcversion", mcVersion

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': modVersion, 'mcversion': mcVersion
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

jar {
    // 文件名带上游戏版本与模组加载器，和 Fabric 线一个规矩：
    // Server-Chat-Translator_3.0.0_mc1.8.9-forge.jar
    // 注意：Gradle 2.14 的属性叫 archiveName（archiveFileName 是 Gradle 5+ 才有的）
    archiveName = "${archivesBaseName}_${modVersion}_mc${mcVersion}-${loaderTag}.jar"

    // 核心插件声明：FMLCorePlugin 指向 IFMLLoadingPlugin 实现，
    // FMLCorePluginContainsFMLMod 表示「这个 jar 同时还是普通模组」（里面还有 @Mod 类）。
    // 少了第二行，FML 会把整个 jar 只当核心插件、不加载 @Mod，模组等于没装上。
    manifest {
        attributes(
                'FMLCorePlugin': 'com.isomeria.hxtranslate.forge.asm.HxLoadingPlugin',
                'FMLCorePluginContainsFMLMod': 'true'
        )
    }

    // MIT 要求「随软件分发时附带许可副本」。v3.0.0 的洁净度审计发现这一侧**根本没有**：
    // Fabric 线一直在打包 LICENSE，Forge 线漏了 —— 两条线的产物内容因此不一致。
    //
    // 路径必须写成 project.file('../LICENSE')，两个坑都实测过（都属于「不报错的静默漏打包」）：
    //  · rootProject.file('LICENSE') 是**错的**：本目录有独立的 settings.gradle，
    //    因此 rootProject 就是 forge-1.8.9 自己，那个 LICENSE 根本不存在，Gradle 直接跳过；
    //  · 只写 from('../LICENSE') 在本套工具链（Gradle 2.14 + ForgeGradle 2.1）上同样什么都不做。
    //    project.file() 的相对路径是相对**本项目目录**解析的，显式写出来才可靠。
    // 改完务必用「解开 jar 看有没有 LICENSE 条目」来验证，构建成功**不能**当作证据。
    from project.file('../LICENSE')
}

// 源码包的名字与 Fabric 线对齐（v3.0.0 洁净度审计）：
// 默认是 <archivesBaseName>-<version>-sources.jar（Server-Chat-Translator-3.0.0-sources.jar），
// 既没有 mc 段也没有加载器段 —— 下载页上两个 sources 包一看不出是给哪条线的。
// 任务名是 ForgeGradle 2.1 提供的 sourceJar（不是 Fabric 那边的 sourcesJar）。
tasks.matching { it.name == 'sourceJar' }.all { task ->
    task.archiveName = "${archivesBaseName}_${modVersion}_mc${mcVersion}-${loaderTag}-sources.jar"
}

