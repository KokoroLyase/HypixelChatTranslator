org.gradle.jvmargs=-Xmx2G

# ------------------------------------------------------------------
# 1.8.9 线专属的构建参数。**模组版本号不在这里** —— 它只认仓库根目录的
# gradle.properties（两条线永远是同一个 mod_version），见 build.gradle。
#
# 两个坑（都实测过，别改）：
#  - ForgeGradle 的插件 id 是 net.minecraftforge.gradle.forge，老教程里的
#    apply plugin: 'forge' 在这个版本会报 "Plugin with id 'forge' not found"；
#  - 映射只能是 stable_22：1.8.9 没有 mcp_stable:20（那是 1.8.8 的），
#    而官方 MDK 里至今写着 stable_20，直接用会 404。
# ------------------------------------------------------------------
minecraft_version=1.8.9
forge_version=1.8.9-11.15.1.2318-1.8.9
mappings_version=stable_22
