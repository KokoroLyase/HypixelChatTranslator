plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html for more information.
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API provides the chat send/receive events, the key mapping registry and client commands.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// ------------------------------------------------------------------
// 离线自检（tools/VerifyCore.java）
//
// 单独一个源集，并挂到 check 上：`./gradlew build`（本地和 CI 用的是同一条命令）
// 会顺带跑完全部断言，不需要任何人记得手动敲 javac/java 两行。
// 自检不依赖 Minecraft 运行时，只用到 gson / slf4j，几秒内跑完。
// ------------------------------------------------------------------
sourceSets {
	verify {
		java.srcDir 'tools'
		compileClasspath = sourceSets.main.output + configurations.compileClasspath
		runtimeClasspath = output + compileClasspath
	}
}

tasks.register('verifyCore', JavaExec) {
	group = 'verification'
	description = '运行离线自检：语言判断 / 命令解析 / HTTP 与配置迁移'
	dependsOn tasks.named('verifyClasses')
	classpath = sourceSets.verify.runtimeClasspath
	mainClass = 'VerifyCore'
}

tasks.named('check') {
	dependsOn tasks.named('verifyCore')
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	// 文件名带上游戏版本与模组加载器，和主流模组一致：
	// hx-chat-translator-2.0.0+mc26.3-fabric.jar
	archiveFileName = "${project.archives_base_name}-${project.mod_version}+mc${project.minecraft_version}-fabric.jar"

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

tasks.matching { it.name == "sourcesJar" }.configureEach {
	archiveFileName = "${project.archives_base_name}-${project.mod_version}+mc${project.minecraft_version}-fabric-sources.jar"
}
