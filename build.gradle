plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html for more information.
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API provides the chat send/receive events, the key mapping registry and client commands.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// ------------------------------------------------------------------
// 离线自检（tools/VerifyCore.java）
//
// 单独一个源集，并挂到 check 上：`./gradlew build`（本地和 CI 用的是同一条命令）
// 会顺带跑完全部断言，不需要任何人记得手动敲 javac/java 两行。
// 自检不依赖 Minecraft 运行时，只用到 gson / slf4j，几秒内跑完。
//
// 关键：下面刻意把 Minecraft / Fabric 从自检的类路径里**剔除**。
// 光靠「约定」是不够的：2026-09 的排查发现自检 JVM 里其实加载得到 Minecraft 与
// ClientModInitializer，于是 TranslationService 里一句 HxTranslateClient.LOGGER
// 在自检和游戏里都「正常」，谁也没发现它把「打日志」和「加载 Fabric 加载器 API」
// 绑在了一起（详见 CHANGELOG v2.1.0）。剔除之后，任何纯逻辑类误引用游戏 API
// 都会在自检里立刻抛 NoClassDefFoundError，而不是等到某个玩家的环境里才炸。
// ------------------------------------------------------------------
// ------------------------------------------------------------------
// 源码布局：共享层 + 各加载器专属层
//
// `src/shared/java` 是**纯逻辑**（不 import 任何 Minecraft / Fabric / Forge 类），
// 由本构建与 `forge-1.8.9/` 那个独立构建**编译同一份文件**。这样两条线的决策逻辑
// 只有一份实现，离线自检（tools/VerifyCore.java）跑一遍就等于同时验证了两个版本。
//
// 代价是共享层必须锁定在 **Java 8 语法**（1.8.9 只支持 Java 8）：不能用 record、
// 文本块、List.of、switch 表达式等。这条约束是双版本策略的前提，细节见 RELEASING.md。
//
// `src/main/java` 只放 Fabric 专属的装配面（入口、事件注册、聊天渲染、命令）。
// ------------------------------------------------------------------
sourceSets {
	main {
		java.srcDirs = ['src/main/java', 'src/shared/java']
	}
	verify {
		java {
			srcDir 'tools'
			// 只编译 VerifyCore：tools/ 下还有 VerifyCoremod.java（要 ASM 与 Forge 装配类，
			// 它由 forge-1.8.9 的构建单独编译并运行），不加过滤会把它也拉进来。
			include 'VerifyCore.java'
		}
		// 只保留 slf4j 之类「不是游戏也不是加载器」的库；gson 来自 Minecraft 的传递依赖，
		// 所以要按名放行。要用的新库记得在这里补一条。
		def pureLibraries = configurations.compileClasspath.filter { file ->
			!file.name.startsWith('minecraft-')
					&& !file.name.startsWith('fabric-loader')
					&& !file.name.startsWith('fabric-api')
					&& !file.name.startsWith('lwjgl')
					&& !file.name.startsWith('authlib')
		}.filter { file ->
			file.name.startsWith('gson-') || file.name.startsWith('slf4j-')
		}
		compileClasspath = sourceSets.main.output + pureLibraries
		runtimeClasspath = output + compileClasspath
	}
}

tasks.register('verifyCore', JavaExec) {
	group = 'verification'
	description = '运行离线自检：语言判断 / 命令解析 / HTTP 与配置迁移'
	dependsOn tasks.named('verifyClasses')
	classpath = sourceSets.verify.runtimeClasspath
	mainClass = 'VerifyCore'
}

tasks.named('check') {
	dependsOn tasks.named('verifyCore')
}

jar {
	// 文件名带上游戏版本与模组加载器，和主流模组一致：
	// Server-Chat-Translator_3.0.0_mc26.3-fabric.jar
	archiveFileName = "${project.archives_base_name}_${project.mod_version}_mc${project.minecraft_version}-fabric.jar"

	// MIT 要求「随软件分发时附带许可副本」。这里刻意**不改名**：
	// 以前写成 LICENSE_<项目名>（无扩展名、还带项目名），既不像标准许可文件、
	// 也让两条线的产物不一致 —— 审计时两个 jar 一个有一个没有，很难一眼看出是缺了。
	from("LICENSE")
}

tasks.matching { it.name == "sourcesJar" }.configureEach {
	archiveFileName = "${project.archives_base_name}_${project.mod_version}_mc${project.minecraft_version}-fabric-sources.jar"
}
