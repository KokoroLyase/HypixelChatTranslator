# 构建与发布流程见仓库根目录的 RELEASING.md
# push/PR 会构建并上传 jar；推 v*-mc*-fabric 标签会额外创建/更新对应的 Release
# 1.8.9 + Forge 线是独立的 workflow（build-forge.yml），各盯自己的标签格式。
name: Build

on:
  push:
    branches: [ main ]
    # 双版本并行后，tag / Release 名的格式是 v<版本>-mc<游戏版本>-<加载器>（RELEASING §10.2），
    # 刻意与产物文件名对齐：
    #   Fabric 线 v2.3.0-mc26.3-fabric   （产物 ...-2.3.0+mc26.3-fabric.jar）
    #   Forge  线 v2.3.0-mc1.8.9-forge  （产物 ...-2.3.0+mc1.8.9-forge.jar）
    # 这里只认 -fabric。写成 v*-mc*-fabric 而不是笼统的 v*-fabric，
    # 是为了让「漏了 mc 段」的名字（v2.4.0-fabric、裸 v2.4.0）**不会**自动发版 ——
    # 宁可什么都不发、让人工发现名字写错，也不要发一个名字不符合约定的版。
    tags: [ 'v*-mc*-fabric' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build --no-daemon --console=plain

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: hx-chat-translator
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

      # 打 v* 标签时自动发布 Release 并附上 jar；已存在则覆盖上传
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          echo "发布产物: $JAR"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            && gh release upload "$GITHUB_REF_NAME" "$JAR" --clobber \
            || gh release create "$GITHUB_REF_NAME" "$JAR" \
                 --title "$GITHUB_REF_NAME" --generate-notes
