# 构建与发布流程见仓库根目录的 RELEASING.md
# push/PR 会构建并上传 jar；推 v*-fabric 标签会额外创建/更新对应的 Release
# 1.8.9 + Forge 线是独立的 workflow（build-forge.yml），各盯自己的后缀。
name: Build

on:
  push:
    branches: [ main ]
    # 双版本并行后，Release 名按加载器加后缀（RELEASING §10.2）：
    #   Fabric 线 v<版本>-fabric，Forge 线 v<版本>-forge
    # 所以这里只认 -fabric；没有后缀的裸 v2.4.0 不会自动发 Release
    # （宁可什么都不发、让人工发现名字写错了，也不要发一个名字不符合约定的版）。
    tags: [ 'v*-fabric' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build --no-daemon --console=plain

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: hx-chat-translator
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

      # 打 v* 标签时自动发布 Release 并附上 jar；已存在则覆盖上传
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          echo "发布产物: $JAR"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            && gh release upload "$GITHUB_REF_NAME" "$JAR" --clobber \
            || gh release create "$GITHUB_REF_NAME" "$JAR" \
                 --title "$GITHUB_REF_NAME" --generate-notes
