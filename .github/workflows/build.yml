# 构建与发布流程见仓库根目录的 RELEASING.md
# push/PR 会构建并上传 jar；推 v* 标签会额外创建/更新对应的 Release
# 注意：1.8.9 + Forge 线是独立的 workflow（build-forge.yml），见下面 job 上的 if
name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # 1.8.9 + Forge 线的标签形如 v2.3.0-forge，由 build-forge.yml 负责。
    # 这里必须排除，否则同一个标签会被两条线各建一次 Release。
    if: ${{ !endsWith(github.ref, '-forge') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build --no-daemon --console=plain

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: hx-chat-translator
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

      # 打 v* 标签时自动发布 Release 并附上 jar；已存在则覆盖上传
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          echo "发布产物: $JAR"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            && gh release upload "$GITHUB_REF_NAME" "$JAR" --clobber \
            || gh release create "$GITHUB_REF_NAME" "$JAR" \
                 --title "$GITHUB_REF_NAME" --generate-notes
