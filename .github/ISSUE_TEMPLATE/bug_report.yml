name: Bug 反馈
description: 模组没按预期工作时用这个模板
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        先确认两件事，能省掉一半来回：

        1. **模组版本与 MC 版本对得上** —— v2.x 只支持 **MC 26.3**；还在玩 26.2 请用
           [v1.1.3](https://github.com/KokoroLyase/HypixelChatTranslator/releases/tag/v1.1.3)；
        2. **已经是最新版** —— 很多问题在更新里修掉了，见
           [最新版 Release](https://github.com/KokoroLyase/HypixelChatTranslator/releases/latest)。

  - type: input
    id: mod-version
    attributes:
      label: 模组版本
      description: 照抄文件名里的版本号，例如 hx-chat-translator-2.1.1+mc26.3-fabric.jar 就填 2.1.1
      placeholder: 2.1.1
    validations:
      required: true

  - type: input
    id: game-version
    attributes:
      label: Minecraft / Fabric Loader / Fabric API 版本
      placeholder: 26.3 / 0.19.5 / 0.160.5+26.3
    validations:
      required: true

  - type: dropdown
    id: language
    attributes:
      label: 客户端语言
      options:
        - 中文
        - 英文
        - 其它
    validations:
      required: true

  - type: input
    id: scene
    attributes:
      label: 服务器与场景
      description: 哪个服务器、什么玩法/频道（例如 Hypixel Bed Wars 单排、/shout 喊话）
      placeholder: Hypixel Bed Wars 单排

  - type: textarea
    id: what-happened
    attributes:
      label: 现象
      description: 说清「你做了什么、期望什么、实际发生了什么」。有截图最好贴一张。
      placeholder: |
        我做了什么：
        期望：
        实际：
    validations:
      required: true

  - type: textarea
    id: debug-output
    attributes:
      label: 游戏内诊断输出
      description: 依次执行下面两条命令，把输出贴上来（统计数字与跳过原因基本能定位到具体分支）
      value: |
        ```
        /hxtranslate status
        /hxtranslate debug on
        ```
        `debug on` 之后复现一次，聊天栏会逐条打印「翻译 / 跳过（原因）」，把相关几行贴在下面：

        ```

        ```
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: "`logs/latest.log` 里搜 hxtranslate 的相关行。**贴之前请先删掉 API Key（sk- 开头）**；Key 泄露了就去 platform.deepseek.com 撤销重发。"
      render: text

  - type: checkboxes
    id: confirms
    attributes:
      label: 确认
      options:
        - label: 我已经把上面的输出里的 API Key 删掉了
          required: true
        - label: 我用的是最新版，且模组版本与 MC 版本是对应的
          required: true
