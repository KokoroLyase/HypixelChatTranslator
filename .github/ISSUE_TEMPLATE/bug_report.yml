name: Bug 反馈
description: 模组没按预期工作时用这个模板
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        先确认三件事，能省掉一半来回：

        1. **说清你玩的是哪条线** —— 本模组从 v2.3.0 起同时提供
           **MC 26.3 + Fabric**（`...-<版本>+mc26.3-fabric.jar`）与
           **MC 1.8.9 + Forge**（`...-<版本>+mc1.8.9-forge.jar`）两条线，功能一致、配置通用；
        2. **模组版本与 MC 版本对得上** —— v2.x 只支持 26.3 或 1.8.9；还在玩 26.2 请用
           [v1.1.3](https://github.com/KokoroLyase/HypixelChatTranslator/releases/tag/v1.1.3)；
        3. **已经是最新版** —— 很多问题在更新里修掉了，见
           [Releases](https://github.com/KokoroLyase/HypixelChatTranslator/releases)（Release 名带 `-mc<版本>-<加载器>`）。

        > **1.8.9 的玩家请特别注意**：那一条线是核心插件（coremod）。
        > 如果「打中文没被翻译」而其它功能（收消息翻译、F6、命令）都正常，
        > 多半是字节码注入没生效 —— 日志里会有
        > `[hxtranslate] EntityPlayerSP 字节码注入失败…`，请务必把那一行贴上。

  - type: dropdown
    id: line
    attributes:
      label: 你用的是哪条线
      options:
        - MC 26.3 + Fabric
        - MC 1.8.9 + Forge
    validations:
      required: true

  - type: input
    id: mod-version
    attributes:
      label: 模组版本
      description: 照抄文件名里的版本号，例如 hx-chat-translator-2.3.0+mc26.3-fabric.jar 就填 2.3.0
      placeholder: "2.3.0"
    validations:
      required: true

  - type: input
    id: game-version
    attributes:
      label: 游戏与加载器版本
      description: 26.3 请写 Fabric Loader 与 Fabric API；1.8.9 请写 Forge 版本（推荐 11.15.1.2318）
      placeholder: "26.3 / Fabric Loader 0.19.5 / Fabric API 0.160.5+26.3"
    validations:
      required: true

  - type: dropdown
    id: language
    attributes:
      label: 客户端语言
      options:
        - 中文
        - 英文
        - 其它
    validations:
      required: true

  - type: input
    id: scene
    attributes:
      label: 服务器与场景
      description: 哪个服务器、什么玩法/频道（例如 Hypixel Bed Wars 单排、/shout 喊话）
      placeholder: "Hypixel Bed Wars 单排"

  - type: textarea
    id: what-happened
    attributes:
      label: 现象
      description: 说清「你做了什么、期望什么、实际发生了什么」。有截图最好贴一张。
      placeholder: |-
        我做了什么：
        期望：
        实际：
    validations:
      required: true

  - type: textarea
    id: debug-output
    attributes:
      label: 游戏内诊断输出
      description: 先执行 /hxtranslate status，再执行 /hxtranslate debug on 并复现一次，把输出贴在这里（统计数字与跳过原因基本能定位到具体分支）
      value: |-
        第 1 步 —— /hxtranslate status 的输出：

            在这里粘贴 status 的输出

        第 2 步 —— /hxtranslate debug on 之后复现一次，聊天栏会逐条打印「翻译 / 跳过（原因）」，
        把相关的几行贴到下面（不用全贴）：

            在这里粘贴 debug 输出
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: "logs/latest.log 里搜 hxtranslate 的相关行。贴之前请先删掉 API Key（sk- 开头）；Key 泄露了就去 platform.deepseek.com 撤销重发。"
      render: text

  - type: checkboxes
    id: confirms
    attributes:
      label: 确认
      options:
        - label: 我已经把上面输出里的 API Key 删掉了
          required: true
        - label: 我用的是最新版，且模组版本与 MC 版本、加载器是对应的
          required: true
